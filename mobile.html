<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Psychophysics Pong (Mobile)</title>
    <!-- Google Fonts: VT323 -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #222;
            font-family: 'VT323', monospace, sans-serif;
        }
        #mobile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            width: 100vw;
            box-sizing: border-box;
        }
        #title {
            margin-top: 24px;
            margin-bottom: 8px;
            font-family: 'VT323', monospace, sans-serif;
            font-size: 2.8rem;
            color: #0f0;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #000, 0 0 8px #0f0;
            user-select: none;
        }
        #game-container {
            max-width: 600px;
            width: calc(100vw - 24px);
            height: calc(100dvh - 200px);  /* Leave more space for controls */
            max-height: 800px;
            box-sizing: border-box;
            margin: 12px auto 0 auto;
            background: #888;
            /* Retro border: thick, neon green, double style */
            border: 6px double #0f0;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 16px #0f0;
            overflow: hidden;
            position: relative;
            border-radius: 0;
        }
        #game-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        #controls {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            width: 100vw;
            max-width: 420px;
            margin: 32px 0 24px 0;
            gap: 24px;
        }
        .control-btn {
            flex: 1 1 0;
            font-size: 2.2rem;
            padding: 24px 0;
            margin: 0 8px;
            background: #333;
            color: #0f0;
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: background 0.2s, color 0.2s;
            touch-action: manipulation;
            font-family: 'VT323', monospace, sans-serif;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #000, 0 0 6px #0f0;
        }
        .control-btn:active {
            background: #0f0;
            color: #222;
        }
        @media (max-width: 480px) {
            #game-container, #controls {
                max-width: 100vw;
            }
            .control-btn {
                font-size: 1.5rem;
                padding: 16px 0;
            }
            #title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="mobile-container">
        <div id="title">PSYCHOPHYSICS PONG</div>
        <div id="game-container"></div>
        <div id="controls">
            <button class="control-btn" id="left-btn">&#8592; Left</button>
            <button class="control-btn" id="right-btn">Right &#8594;</button>
        </div>
    </div>
    <!-- Game scripts will be added later -->
    <script src="numeric.js"></script>
    <script src="jsQUEST.js"></script>
    <script src="main.js"></script>
    <script>
    // Debug: Log window and container sizes
    window.addEventListener('DOMContentLoaded', function() {
        var gameContainer = document.getElementById('game-container');
        if (gameContainer) {
            var rect = gameContainer.getBoundingClientRect();
            console.log('[PONG] window.innerWidth =', window.innerWidth, 'window.innerHeight =', window.innerHeight);
            console.log('[PONG] #game-container width =', rect.width, 'height =', rect.height);
        }
    });
    </script>
</body>
</html>
